name: Update RRFS-SD smoke forecast

"on":
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours, offset 30min past to let NOAA finish publishing
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wgrib2 and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wgrib2
          pip install --quiet Pillow

      - name: Run RRFS-SD fetch + decode script
        run: python3 fetch_rrfs_smoke.py

      - name: Commit updated smoke data if it changed
        run: |
          git config user.name "fireline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rrfs_smoke/
          git diff --quiet --cached || git commit -m "Update RRFS-SD smoke forecast"
          git push
