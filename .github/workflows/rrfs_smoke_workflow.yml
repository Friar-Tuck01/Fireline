name: Update RRFS-SD smoke forecast

"on":
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours, offset 30min past to let NOAA finish publishing
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # required so each step runs inside the conda environment
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # wgrib2 is NOT available via apt-get on Ubuntu — it's not packaged there.
      # conda-forge is the standard way to get a working binary without a
      # from-source Fortran build (which needs NCEPLIBS-ip and friends).
      - name: Set up Miniconda with wgrib2
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict

      - name: Install wgrib2 and Pillow
        run: conda install -y -c conda-forge wgrib2 pillow

      - name: Confirm wgrib2 is on PATH
        run: wgrib2 -version

      - name: Run RRFS-SD fetch + decode script
        run: python3 fetch_rrfs_smoke.py

      - name: Commit updated smoke data if it changed
        run: |
          git config user.name "fireline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rrfs_smoke/
          git diff --quiet --cached || git commit -m "Update RRFS-SD smoke forecast"
          git push
